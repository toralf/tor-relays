---
all:
  vars:
    ansible_ssh_private_key_file: /home/<me>/.ssh/id_...
    ca_name: RootCA
    ca_common_name: ROOT CA tor-relays
    ca_country_name: DE
    filter_sensitive_data: >-
      sed -E
      -e "s,{{ ansible_facts.default_ipv4.address }}[:[0-9]*]*,<snip ipv4>,g"
      -e "s,{{ ansible_facts.default_ipv6.address}}\][:[0-9]*]*,<snip ipv6>],g"
      -e "s,{{ (ansible_facts.default_ipv6.address | split(":"))[:4] | join(":") }}\][:[0-9]*]*,<snip ipv6 net>],g"
      -e s",{{ _prometheus_server_v4 }},<snip prometheus_v4>,g"
      -e s",{{ _prometheus_server_v6 }},<snip prometheus_v6>,g"
      -e "s,[a-zA-Z0-9+/]{70},<snip b64-70>,g"
      -e "s,[a-zA-Z0-9+/]{40},<snip b64-40>,g"

metrics:
  vars:
    metrics_port: "{{ range(..., ...) | random(seed=seed_metrics + seed_host) }}"
    prometheus_server_v4: "1.2.3.4"
    prometheus_server_v6: ::1:2:3:4
  children:
    misc:
    snowflake:
    tor:

#######################################################################
#
#
snapshot:
  children:
    hix:

snowflake:
  vars:
    snowflake_command_args: >-
      -nat-retest-interval 1h -summary-interval 0h0m15s
    git_url: https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/snowflake.git
  children:
    snowflake_ionos:
    snowflake_test:

tor:
  vars:
    ddos_metrics: true
    torrc_config_group:
      - name: ContactInfo
        value: >-
          email: ...
      - name: Nickname
        value: "{{ nickname }}"
      #
      # https://gitlab.torproject.org/tpo/core/tor/-/issues/40958
      #
      # relay
      - name: DirReqStatistics
        value: 0
      - name: ExtraInfoStatistics
        value: 0
      - name: PaddingStatistics
        value: 0
      # server only
      - name: HiddenServiceStatistics
        value: 0
      # server extra stats
      # - name: CellStatistics
      #   value: 1
      # - name: ConnDirectionStatistics
      #   value: 1
      # - name: EntryStatistics
      #   value: 1
    tor_port: "{{ range(..., ...) | random(seed=seed_torport + seed_host) }}"
    tor_metrics: true
  children:
    private:
    public:
    server:

#######################################################################
#
# tor
#
private:
  vars:
    tor_bridge_distribution: none
  children:
    private_test:

public:
  vars:
    tor_bridge_distribution: any
  children:
    public_hetzner:
    public_ionos:

# Exit:
#   additional_software:
#     - dns-root-data
#     - unbound
server:
  vars:
    tor_bridge_distribution: ""
    node_metrics: true
  children:
    server_ionos:
    server_test:
