---
- name: Git
  environment: "{{ _git_environment | default({}) }}"
  module_defaults:
    ansible.builtin.git:
      repo: "{{ _git_repo_url }}"
      dest: "{{ _repo_dir }}"
  block:
    - name: Git stat "{{ _repo_dir }}"
      ansible.builtin.git:
        clone: false
        update: false
      register: __stat

    - name: Git update "{{ _repo_dir }}"
      throttle: 8
      ansible.builtin.git:
        clone: "{{ __stat.before == None }}"
        force: true
        update: "{{ __stat.before != None }}"
        version: "{{ _git_version }}"
      register: __update

    - name: Git clean "{{ _repo_dir }}"
      changed_when: __clean.stdout | length > 0
      ansible.builtin.command:
        cmd: >-
          git clean --force -d
        chdir: "{{ _repo_dir }}"
      register: __clean

    - name: Git patch "{{ _repo_dir }}"
      throttle: 8
      changed_when: __patch.stdout_lines is search('patching file ')
      ansible.builtin.shell:
        cmd: |-
          set -euf

          rm -f tmp.patch
          curl -s {{ inside_item }} -o tmp.patch
          patch -p 1 --forward -i tmp.patch
          rm tmp.patch
        chdir: "{{ _repo_dir }}"
      loop_control:
        loop_var: inside_item
      loop: "{{ _git_patches | default([]) }}"
      register: __patch

    - name: Git repo changed "{{ _repo_dir }}"
      changed_when: _git_repo_changed
      ansible.builtin.set_fact:
        _git_repo_changed: "{{ __stat.changed or __update.changed or
          __clean.changed or __patch.changed }}"
