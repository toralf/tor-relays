---
- name: Sum connections
  changed_when: false
  failed_when: false
  ansible.builtin.shell:
    cmd: |-
      set -eu

      equatation=$(
        set -o pipefail

        journalctl -u snowflake --since "{{ log_connections_seconds_ago }} second ago" \
          -g ', there were .* connections' --quiet |
        awk '{ print $14 }' |
        xargs -r |
        tr ' ' '+'
      )
      echo $(( equatation ))
    executable: /bin/bash
  register: _result_conns

- name: File connections
  delegate_to: localhost
  throttle: 1
  ansible.builtin.lineinfile:
    line: "{{ inventory_hostname }} {{ _result_conns.stdout | default('n/a') }}"
    path: "{{ infodir }}/snowflake_connections"
    regexp: "^{{ inventory_hostname }} "
