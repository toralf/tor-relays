---
- name: Look for core dump/s
  ansible.builtin.find:
    paths: "{{ coredump_paths }}"
    patterns: "{{ coredump_patterns }}"
    limit: "{{ coredump_limit }}"
    get_checksum: true
    recurse: true
  register: _result_minicoredumper

- name: Results of coredump
  when: _result_minicoredumper.files is defined and _result_minicoredumper.files | length < 50
  vars:
    _fname: "{{ item.path }}"
    _unique_id: "{{ inventory_hostname }}.{{ _fname | dirname | basename }}"
  ansible.builtin.include_tasks: _coredump.yaml
  loop_control:
    label: "{{ _unique_id }}"
  loop: "{{ _result_minicoredumper.files }}"
