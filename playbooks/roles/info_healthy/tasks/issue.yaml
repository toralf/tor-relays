---
- name: Look for issue/s
  changed_when: false
  failed_when: _result_syslog.stderr | length > 0
  ansible.builtin.shell:
    cmd: |-
      journalctl {{ (issue_since | length > 0) | ternary('--since "' + issue_since + '"', '-b') }} --quiet |
        grep -F \
          -e 'BUG: ' \
          -e 'BUG at' \
          -e 'Call Trace: ' \
          -e 'Error: ' \
          -e 'invoked oom-killer' \
          -e 'No space left on device' \
          -e 'Oops: ' \
          -e 'rebooting.' \
          -e '.service: Control process exited' \
          -e 'status=9/KILL' \
          -e "WARNING:" |
        grep -v -F \
          -e 'cloud-init.service: Control process exited' \
          -e "Error: argument 'stop' not supported" \
          -e 'kernel: Speculative Return Stack Overflow: ' \
          -e ': System is rebooting.' |
        tail -n 30
  register: _result_syslog

- name: File issue
  delegate_to: localhost
  throttle: 1
  ansible.builtin.blockinfile:
    block: "{{ _result_syslog.stdout }}"
    path: "{{ infodir }}/issue.txt"
    marker: "# {mark} {{ inventory_hostname }} "
    state: "{{ (_result_syslog.stdout | length > 0) | ternary('present', 'absent') }}"
