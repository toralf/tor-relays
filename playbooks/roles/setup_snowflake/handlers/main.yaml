---
- name: Load sysctl
  listen: Load sysctl
  changed_when: true
  failed_when: false # failures expected for older kernels
  ansible.builtin.command:
    cmd: >-
      sysctl --system >/dev/null

- name: Restart snowflake
  listen: Restart snowflake
  ansible.builtin.systemd_service:
    name: snowflake
    state: restarted
    enabled: true
    daemon_reload: true
