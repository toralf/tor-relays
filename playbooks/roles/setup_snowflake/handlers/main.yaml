---
- name: Load sysctl
  listen: Load sysctl
  changed_when: true
  ansible.builtin.command:
    cmd: >-
      sysctl --system >/dev/null

- name: Restart Snowflake
  listen: Restart Snowflake
  ansible.builtin.systemd_service:
    name: snowflake-proxy
    state: restarted
    enabled: true
    daemon_reload: true
