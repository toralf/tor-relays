---
- name: Add the group
  ansible.builtin.group:
    name: snowflake-proxy

- name: Add the user
  ansible.builtin.user:
    group: snowflake-proxy
    name: snowflake-proxy
    create_home: false

- name: Golang
  ansible.builtin.import_tasks: "{{ role_path }}/../../../playbooks/roles/lib/golang.yaml"
  tags:
    - tools

- name: Git
  vars:
    _git_patches: "{{ snowflake_git_patches }}"
    _git_repo_url: https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/snowflake.git
    _git_version: "{{ snowflake_git_version }}"
    _repo_dir: /root/snowflake
  ansible.builtin.include_tasks: "{{ role_path }}/../../../playbooks/roles/lib/git.yaml"

- name: Build
  throttle: 16
  changed_when: false
  vars:
    _cmd: go build -v
  ansible.builtin.shell:
    cmd: |-
      if ! {{ _cmd }}; then
        if ! GOPROXY="https://goproxy.io" {{ _cmd }}; then
          GOPROXY="direct" {{ _cmd }}
        fi
      fi
    chdir: /root/snowflake/proxy

- name: Copy
  ansible.builtin.copy:
    src: /root/snowflake/proxy/proxy
    dest: /usr/bin/snowflake-proxy
    mode: a+x
    remote_src: true
  notify: Restart Snowflake

- name: Add/Change systemd unit
  ansible.builtin.copy:
    src: snowflake-proxy.service
    dest: /etc/systemd/system/
  notify: Restart Snowflake
