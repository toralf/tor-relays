---
- name: Main
  module_defaults:
    ansible.builtin.apt:
      allow_change_held_packages: true
      autoclean: true
      autoremove: true
      purge: true
      state: latest
    ansible.builtin.copy:
      mode: "0644"
    ansible.builtin.file:
      mode: "0644"
  block:
    - name: Validate
      ansible.builtin.import_tasks: validate.yaml
      tags:
        - validate

    - name: Tools
      ansible.builtin.import_tasks: tools.yaml
      tags:
        - tools

    - name: Setup
      ansible.builtin.import_tasks: _snowflake-setup.yaml
      tags:
        - snowflake

    - name: Configure
      ansible.builtin.import_tasks: config.yaml
      tags:
        - config

    - name: Geoip
      ansible.builtin.import_tasks: geoip.yaml
      tags:
        - geoip
        - never

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers
      tags:
        - flush

    - name: Ensure Snowflake is enabled and started
      ansible.builtin.systemd_service:
        name: snowflake
        state: started
        enabled: true
