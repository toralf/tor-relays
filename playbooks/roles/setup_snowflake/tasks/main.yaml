---
- name: Validate
  ansible.builtin.import_tasks: validate.yaml
  tags:
    - always
    - validate

- name: Main
  module_defaults:
    ansible.builtin.apt:
      allow_change_held_packages: true
      autoclean: true
      autoremove: true
      purge: true
      state: latest
    ansible.builtin.copy:
      mode: "0644"
    ansible.builtin.file:
      mode: "0644"
    ansible.builtin.systemd_service:
      daemon_reload: true
  block:
    - name: Tools
      ansible.builtin.import_tasks: tools.yaml
      tags:
        - tools

    - name: Setup
      ansible.builtin.import_tasks: snowflake-src.yaml
      tags:
        - snowflake

    - name: Config
      ansible.builtin.import_tasks: config.yaml
      tags:
        - config

    - name: Geoip
      ansible.builtin.import_tasks: geoip.yaml
      tags:
        - geoip
        - never

    - name: Enable/Start Snowflake
      ansible.builtin.systemd_service:
        name: snowflake
        state: started
        enabled: true
