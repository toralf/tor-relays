---
- name: Set sysctl values
  ansible.builtin.copy:
    content: |
      # maintained by Ansible

      user.max_user_namespaces = 4
    dest: /etc/sysctl.d/23snowflake.conf
  notify: Load sysctl
  tags:
    - sysctl

- name: Add/Change systemd unit
  ansible.builtin.template:
    src: snowflake-proxy.service.j2
    dest: /etc/systemd/system/snowflake.service
  notify: Restart snowflake
