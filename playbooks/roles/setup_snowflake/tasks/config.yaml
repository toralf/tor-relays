---
- name: Set sysctl values
  ansible.builtin.copy:
    content: |
      # maintained by Ansible

      user.max_user_namespaces = 4
    dest: /etc/sysctl.d/23snowflake.conf
  notify: Load sysctl
  tags:
    - sysctl

- name: Ensure that Snowflake systemd override dir exists
  ansible.builtin.file:
    path: /etc/systemd/system/snowflake-proxy.service.d
    state: directory
    mode: "0755"

- name: Add Snowflake systemd override
  ansible.builtin.copy:
    content: |
      # Ansible managed

      [Unit]
      After=network-online.target docker.socket firewalld.service systemd-networkd-wait-online.service
      StartLimitIntervalSec=0
      StartLimitBurst=0

      [Service]
      ExecStart=
      ExecStart=/usr/bin/snowflake-proxy {{ snowflake_command_args }}
      Restart=on-failure
      RestartSec=60s
    dest: /etc/systemd/system/snowflake-proxy.service.d/override.conf
  notify: Restart Snowflake
