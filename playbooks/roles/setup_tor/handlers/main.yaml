---
- name: Restart Tor
  listen: Restart Tor
  ansible.builtin.systemd_service:
    name: tor
    state: restarted
    enabled: true
    daemon_reload: true

- name: Reload Tor
  listen: Reload Tor
  ansible.builtin.systemd_service:
    name: tor
    state: reloaded
    enabled: true

- name: Kill running metrics.sh
  listen: Restart metrics
  failed_when: false
  changed_when: false
  ansible.builtin.command:
    cmd: |-
      pkill -9 -f "metrics.sh"

- name: Restart metrics
  listen: Restart metrics
  changed_when: true
  ansible.builtin.shell:
    cmd: |-
      nohup nice /root/metrics.sh 15 /var/www/metrics-ddos >/dev/null 2>&1 &

- name: Restart watchdog
  listen: Restart watchdog
  changed_when: true
  ansible.builtin.shell:
    cmd: |-
      pkill -9 -x watchdog.sh
      echo 'nice /root/watchdog.sh &' | at now
