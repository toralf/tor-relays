---
- name: Load sysctl
  listen: Load sysctl
  changed_when: true
  ansible.builtin.command:
    cmd: >-
      sysctl --system >/dev/null

- name: Restart Tor
  listen: Restart Tor
  ansible.builtin.systemd_service:
    name: tor
    state: restarted
    enabled: true
    daemon_reload: true
    no_block: true

- name: Reload Tor
  listen: Reload Tor
  ansible.builtin.systemd_service:
    name: tor
    state: reloaded
    enabled: true
