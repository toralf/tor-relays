---
tor_build_from_source: false
use_tor_geoip_data: false

tor_git_patches: []
tor_git_version: main

go_version: ""
lyrebird_git_patches: []
lyrebird_git_version: main

# DDoS solution
torutils_path: "https://github.com/toralf/torutils/raw/{{ torutils_git_version | default('main') }}"

tor_nickname: ""

# the ORPort or PT port
tor_port: 0

# safe default: Tor private bridge, e.g. "any" for a bridge or an empty for a relay
tor_bridge_distribution: none

# CPU consuming
tor_metrics: false

# file/s containing a private FamilyId key
tor_secret_family_key_files: []

# <name, value> elements
torrc_config: []

# The secret Tor keys
tor_identity_backup: false
tor_identity_restore: false
