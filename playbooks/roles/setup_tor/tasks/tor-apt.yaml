---
- name: Repo
  ansible.builtin.import_tasks: "{{ role_path }}/../../../playbooks/roles/lib/tor-deb-repo.yaml"

# https://bugs.debian.org/cgi-bin/bugreport.cgi?bug=1021911
- name: Allow low port for Tor apt
  vars:
    _exe: "{{ (tor_bridge_distribution | length > 0) | ternary('/usr/bin/obfs4proxy', '/usr/bin/tor') }}"
  ansible.builtin.lineinfile:
    line: >-
      DPkg::Post-Invoke { "setcap cap_net_bind_service=+ep {{ _exe }}"; };
    path: /etc/apt/apt.conf.d/99-tor-lowport
    state: "{{ (tor_port < 1024) | ternary('present', 'absent') }}"
  notify: Restart Tor

- name: Install/Update Tor/PT
  ansible.builtin.apt:
    name: "{{ ['tor', 'tor-geoipdb'] + (['obfs4proxy'] if (tor_bridge_distribution | length > 0) else []) }}"
