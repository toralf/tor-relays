---
- name: Install/Update toolchain for Tor
  when: ansible_facts.os_family == 'Debian'
  ansible.builtin.apt:
    name:
      - automake
      - build-essential
      - libevent-dev
      - libssl-dev
      - zlib1g-dev
      - "{{ (ansible_facts.distribution == 'Ubuntu') | ternary('autotools-dev', omit) }}"
      - "{{ (tor_bridge_distribution | length == 0) | ternary('libseccomp-dev', omit) }}"

- name: Install/Update toolchain for Tor bridge
  when: tor_bridge_distribution | length > 0
  ansible.builtin.import_tasks: "{{ role_path }}/../../../playbooks/roles/lib/golang.yaml"
