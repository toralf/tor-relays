---
- name: Create local DDoS info directory
  delegate_to: localhost
  throttle: "{{ concurrent_local_jobs }}"
  ansible.builtin.file:
    state: directory
    path: "{{ infodir }}/fw/{{ inventory_hostname }}/"
    mode: "0755"

- name: Trigger DDoS save
  changed_when: true
  ansible.builtin.shell:
    cmd: |-
      set -euf

      /root/ipv4-rules.sh save
      /root/ipv6-rules.sh save

- name: Get DDoS ipset name
  ansible.builtin.find:
    paths: /var/tmp/
    patterns: torutils-ddos-v*
    file_type: file
  register: ddos_ipset

- name: Fetch DDoS ipset
  throttle: "{{ concurrent_local_jobs }}"
  ansible.builtin.fetch:
    src: "{{ item.path }}"
    dest: "{{ infodir }}/fw/{{ inventory_hostname }}/"
  loop_control:
    label: "{{ item.path }}"
  loop: "{{ ddos_ipset.files | default([]) }}"

- name: Get DDoS hash name
  ansible.builtin.find:
    paths:
      - /proc/net/ipt_hashlimit/
      - /proc/net/ip6t_hashlimit/
    patterns: torutils-ddos-v*
    file_type: file
  register: ddos_hash

- name: Fetch DDoS hash
  throttle: "{{ concurrent_local_jobs }}"
  ansible.builtin.fetch:
    src: "{{ item.path }}"
    dest: "{{ infodir }}/fw/{{ inventory_hostname }}/"
    validate_checksum: false
  loop_control:
    label: "{{ item.path }}"
  loop: "{{ ddos_hash.files | default([]) }}"
