---
- name: Get Heartbeat
  changed_when: false
  ansible.builtin.shell:
    cmd: |-
      zgrep -h -F 'Heartbeat: Tor' notice.log.1 notice.log |
        tail -n 4
    chdir: /var/log/tor/
    executable: /bin/bash
  register: _result_heartbeat

- name: Results of Heartbeat
  when: _result_heartbeat.stdout | length > 0
  changed_when: true
  ansible.builtin.debug:
    var: _result_heartbeat.stdout_lines
