---
- name: Check error log
  changed_when: false
  ansible.builtin.shell:
    cmd: |-
      zgrep -h -v \
        -e 'opening .*log file.' \
        err.log.1 err.log |
        tail -n 50 |
        {{ filter_sensitive_data }}
    chdir: /var/log/tor/
    executable: /bin/bash
  register: _result_log_err

- name: Results of error log
  when: _result_log_err.stdout | length > 0
  changed_when: true
  ansible.builtin.debug:
    var: _result_log_err.stdout_lines
  notify: Not Healthy
