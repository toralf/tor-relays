---
- name: Configure
  changed_when: _kernel_configured.rc == 123
  failed_when: _kernel_configured.rc not in (0, 123)
  ansible.builtin.shell:
    cmd: |-
      set -euf

      before=$(grep -v '^#' -e '^$' .config | md5sum)

      cp /boot/config-{{ ansible_facts.kernel }} .config
      # force module loading
      ss >/dev/null
      yes '' | make localmodconfig >/dev/null
      cat <<EOF >>.config
      {{ kernel_git_config }}
      EOF
      yes '' | make oldconfig >/dev/null
      if [[ {{ ansible_facts.distribution }} == 'Ubuntu' ]]; then
        scripts/config --disable CONFIG_EFI
        scripts/config --disable SYSTEM_REVOCATION_KEYS
        scripts/config --disable SYSTEM_TRUSTED_KEYS
        scripts/config --disable CONFIG_VSOCKETS
      fi

      after=$(grep -v -e '^#' -e '^$' .config | md5sum)
      if [[ $before != $after ]]; then
        exit 123
      fi
    chdir: /root/linux
    executable: /bin/bash
  register: _kernel_configured
