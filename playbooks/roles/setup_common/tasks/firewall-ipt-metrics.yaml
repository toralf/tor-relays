---
- name: Get metrics.sh
  throttle: 8
  retries: 1
  ansible.builtin.get_url:
    url: "{{ torutils_path }}/metrics.sh"
    dest: /root/
  notify: Restart metrics.sh

- name: Create nginx metrics-ddos
  ansible.builtin.file:
    path: /var/www/metrics-firewall
    state: directory
    group: www-data
    mode: "0750"
  notify: Restart metrics.sh

- name: Cron job for metrics.sh
  ansible.builtin.cron:
    name: Firewall metrics
    special_time: reboot
    job: >-
      nice /root/metrics.sh 15 /var/www/metrics-firewall
    state: "{{ firewall_metrics | ternary('present', 'absent') }}"
  notify: Restart metrics.sh

- name: Ensure that metrics.sh is running
  changed_when: _metrics_status.rc != 0
  failed_when: false
  ansible.builtin.shell:
    cmd: |-
      kill -0 $(cat /tmp/torutils-metrics.sh.lock)
  register: _metrics_status
  notify: Restart metrics.sh
