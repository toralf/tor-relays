---
- name: Get line number of tarpit iptables rule
  changed_when: false
  ansible.builtin.shell:
    cmd: |-
      set -euf

      if ! iptables -nvL INPUT --line-numbers |
        grep ' add-set torutils-tarpit-v' |
        cut -f 1 -d ' ' |
        grep .; then
        n=$(
          iptables -nvL INPUT --line-numbers |
            tail -n 1 |
            cut -f 1 -d ' '
        )
        echo $((n + 1))
      fi
  register: _line_no

- name: ACCEPT incoming UDP to (ephemeral ports of) Snowflake
  ansible.builtin.iptables:
    ip_version: "ip{{ item }}"
    chain: INPUT
    table: filter
    protocol: udp
    destination: "{{ (item == 'v4') | ternary(ansible_facts.default_ipv4.address, ansible_facts.default_ipv6.address) }}"
    destination_ports: "32768:60999" # /proc/sys/net/ipv4/ip_local_port_range
    jump: ACCEPT
    action: insert
    rule_num: "{{ _line_no.stdout }}"
  loop:
    - v4
    - v6

- name: Save iptables after Snowflake firewall setup
  community.general.iptables_state:
    ip_version: "ip{{ item }}"
    state: saved
    path: "/etc/iptables/rules.{{ item }}"
  loop:
    - v4
    - v6
