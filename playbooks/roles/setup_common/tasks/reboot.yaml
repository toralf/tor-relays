---
- name: Check for reboot-required file
  changed_when: _reboot_required.stat.exists
  ansible.builtin.stat:
    path: /var/run/reboot-required
    get_attributes: false
    get_checksum: false
    get_mime: false
  register: _reboot_required
  notify: Reboot

- name: Check if a reboot is needed
  changed_when: _reboot_needed.rc == 123
  environment:
    LC_ALL: C.UTF-8
  ansible.builtin.shell:
    cmd: |-
      set -euf

      needrestart -r a -b
      if needrestart -r l -b | grep -E -e 'NEEDRESTART-KSTA: [23]' -e 'NEEDRESTART-SVC: '; then
        exit 123
      fi
  register: _reboot_needed
  notify: Reboot

- name: Flush handlers (Reboot)
  ansible.builtin.meta: flush_handlers
