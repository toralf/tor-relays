---
- name: Setup
  ansible.builtin.import_tasks: nginx-setup.yaml
  tags:
    - nginx-setup

- name: Openssl
  ansible.builtin.import_tasks: nginx-openssl.yaml
  tags:
    - nginx-openssl

- name: Config
  ansible.builtin.import_tasks: nginx-config.yaml
  tags:
    - nginx-config

- name: Ensure nginx is enabled and started
  ansible.builtin.systemd_service:
    name: nginx
    state: started
    enabled: true
