---
- name: Create Ansible tmp dir for user root
  ansible.builtin.file:
    path: /root/.ansible/tmp
    state: directory
    mode: "0700"
  register: _ansible_tmp

- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Configure sshd
  ansible.builtin.copy:
    content: |
      # Ansible managed

      LogLevel                    ERROR

      PasswordAuthentication      no
      PermitRootLogin             prohibit-password
      PubkeyAuthentication        yes

      X11Forwarding               no
    dest: /etc/ssh/sshd_config.d/00sshd.conf
  notify: Restart ssh

- name: Remove cloud init config for sshd at IONOS
  when: ansible_facts.system_vendor == 'QEMU'
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    state: absent
  notify: Restart ssh

- name: Have only 1 authorized key
  changed_when: false
  failed_when: _result_auth_keys.stdout_lines | length != 1
  ansible.builtin.shell:
    cmd: >-
      wc -l </root/.ssh/authorized_keys
  register: _result_auth_keys

- name: Swapfile
  when: swapfile_size | length > 0
  block:
    - name: Create swapfile
      ansible.builtin.shell:
        cmd: |-
          set -euf

          fallocate -l {{ swapfile_size }} /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          if ! grep -q "^/swapfile " /etc/fstab; then
            echo "/swapfile  none  swap  defaults  0  0" >>/etc/fstab
          fi
        creates: /swapfile

    - name: Sysctl
      ansible.builtin.copy:
        content: |
          # maintained by Ansible

          vm.dirty_background_ratio = 3
          vm.dirty_ratio = 10
          vm.swappiness = 1
          vm.vfs_cache_pressure = 50

        dest: /etc/sysctl.d/22swapfile.conf
      notify: Load sysctl
      tags:
        - sysctl

- name: Remove swapfile
  when: swapfile_size | length == 0
  ansible.builtin.shell:
    cmd: |-
      set -euf

      swapoff -a
      if grep -q "^/swapfile " /etc/fstab; then
        sed -i -e "/^\/swapfile /d" /etc/fstab
      fi
      rm /swapfile
    removes: /swapfile

- name: Suppress motd
  ansible.builtin.copy:
    content: ""
    dest: /root/.hushlogin

- name: Disable motd
  changed_when: false
  ansible.builtin.shell:
    cmd: |-
      chmod -x /etc/update-motd.d/*

- name: Sysctl generic
  ansible.builtin.copy:
    src: 20generic.conf
    dest: /etc/sysctl.d/
  notify: Load sysctl
  tags:
    - sysctl

- name: Sysctl firewall
  vars:
    _max: "{{ (ansible_facts.memtotal_mb < 1024) | ternary((2**17) | int, (2**19) | int) }}"
    _mem: "{{ (ansible_facts.memtotal_mb < 1024) | ternary('1024 2048 4096', '16000 32000 64000') }}"
  tags:
    - sysctl
  block:
    - name: Configure sysctl
      ansible.builtin.copy:
        content: |
          # maintained by Ansible

          net.ipv4.tcp_fin_timeout = 10
          net.ipv4.tcp_keepalive_intvl = 10
          net.ipv4.tcp_keepalive_probes = 3
          net.ipv4.tcp_keepalive_time = 60
          net.ipv4.tcp_max_syn_backlog = {{ _max // 8 }}
          net.ipv4.tcp_mem = {{ _mem }}
          net.ipv4.tcp_synack_retries = 2
          net.ipv4.tcp_syncookies = 1
          net.ipv4.tcp_tw_reuse = 1
          net.ipv4.udp_mem = {{ _mem }}

          # avoid reboot timing issues
          net.ipv6.ip_nonlocal_bind = 1

          net.netfilter.nf_conntrack_tcp_timeout_close_wait = 10
          net.netfilter.nf_conntrack_tcp_timeout_established = 600
          net.netfilter.nf_conntrack_tcp_timeout_time_wait = 10

          net.core.netdev_max_backlog = {{ _max // 8 }}
          net.core.somaxconn = {{ _max // 8 }}

          net.ipv4.tcp_max_syn_backlog = {{ _max // 8 }}
          net.ipv4.tcp_notsent_lowat = {{ _max // 8 }}

          net.netfilter.nf_conntrack_buckets = {{ _max // 8 }}
          net.netfilter.nf_conntrack_max = {{ _max }}
        dest: /etc/sysctl.d/21firewall.conf
      notify: Load sysctl

    - name: Ensure kernel modules gets the right value
      ansible.builtin.copy:
        content: |
          options nf_conntrack hashsize={{ _max }}
        dest: /etc/modprobe.d/nf_conntrack.conf
