---
- name: Install/Update Firewall tools
  ansible.builtin.apt:
    name:
      - jq
      - nftables

- name: Create/Update nftables config
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
  notify: Reload nftables

- name: Check nftables config
  changed_when: false
  ansible.builtin.command:
    cmd: |-
      nft -c -f /etc/nftables.conf

# Configure nftables persistence under /var like Gentoo

- name: Ensure target directory exists to save nftables
  ansible.builtin.file:
    path: /var/lib/nftables
    state: directory
    mode: "0750"

- name: Create override directory for nftables.service
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    mode: "0755"

- name: Add nftables systemd override
  ansible.builtin.copy:
    content: |
      # Ansible managed

      # the filesystem is r-o after reboot
      [Service]
      ExecStart=
      ExecStart=/bin/sh -c ' \
        nft flush ruleset; \
        if ! nft -f /var/lib/nftables/rules-save; then nft -f /etc/nftables.conf; fi'

      ExecStop=
      ExecStop=/bin/sh -c ' \
        { echo "#!/usr/sbin/nft -f"; echo "flush ruleset"; nft -n list ruleset; } >/var/lib/nftables/rules-save; \
        nft flush ruleset'

      ExecReload=
      ExecReload=/bin/sh -c ' \
        nft -c -f /etc/nftables.conf && \
        cat /etc/nftables.conf >>/var/lib/nftables/new && \
      {% if is_tor %}
        echo >>/var/lib/nftables/new && \
        nft list set inet ingress_filter ddos_v4 >>/var/lib/nftables/new && \
        echo >>/var/lib/nftables/new && \
        nft list set inet ingress_filter ddos_v6 >>/var/lib/nftables/new && \
        echo >>/var/lib/nftables/new && \
        nft -c -f /var/lib/nftables/new && \
      {% endif %}
        nft -f /var/lib/nftables/new && \
        rm /var/lib/nftables/new'
    dest: /etc/systemd/system/nftables.service.d/override.conf
  notify: Reload systemd

- name: Ensure iptables is disabled and stopped
  failed_when: false
  ansible.builtin.systemd_service:
    name: iptables
    state: stopped
    enabled: false
    daemon_reload: true

- name: Ensure nftables is enabled and started
  ansible.builtin.systemd_service:
    name: nftables
    state: started
    enabled: true
    daemon_reload: true

# the filesystem is read-only when nftables starts
- name: Create cron job to delete saved nftables after reboot
  ansible.builtin.cron:
    name: delete saved nftables
    special_time: reboot
    job: >-
      sleep 30;
      rm /var/lib/nftables/rules-save
