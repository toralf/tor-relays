---
- name: Reload systemd
  listen: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart systemd-journald
  listen: Restart systemd-journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
    enabled: true
    daemon_reload: true

- name: Restart ssh
  listen: Restart ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted
    enabled: true
    daemon_reload: true

- name: Restart nginx
  listen: Restart nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: restarted
    enabled: true
    daemon_reload: true

- name: Reload nginx
  listen: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
    enabled: true

- name: Reload nftables
  listen: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
    enabled: true

- name: Kill running metrics-firewall.sh
  listen: Restart metrics firewall
  failed_when: false
  changed_when: false
  ansible.builtin.command:
    cmd: |-
      pkill -9 -f "metrics-firewall.sh"

- name: Restart metrics firewall
  listen: Restart metrics firewall
  changed_when: true
  ansible.builtin.shell:
    cmd: |-
      nohup nice /root/metrics-firewall.sh 15 /var/www/metrics-firewall/nftables.prom >/dev/null 2>&1 &

- name: Restart Prometheus node exporter
  listen: Restart Prometheus node exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    state: restarted
    enabled: true
    daemon_reload: true

- name: Restart tor-relay-ipset
  listen: Restart tor-relay-ipset
  ansible.builtin.systemd_service:
    name: tor-relay-ipset
    state: restarted
    enabled: true
    daemon_reload: true

- name: Reboot
  listen: Reboot
  retries: 2
  failed_when: not (
    _reboot_common.rebooted or
    _reboot_common.msg is search('Action reboot already in progress') or
    _reboot_common.msg is search("systemd-update-utmp.service has 'stop' job queued, but 'start' is included in transaction")
    )
  ansible.builtin.reboot:
    post_reboot_delay: 20
    reboot_timeout: 180
    reboot_command: reboot
  register: _reboot_common
