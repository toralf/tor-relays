---
- name: Setup common
  hosts: all
  order: shuffle
  tags:
    - setup-common
  roles:
    - role: ping
    - role: setup_autoupdate
      vars:
        autoupdate_enabled: false
    - role: setup_common

- name: Setup snowflake
  hosts: snowflake
  order: shuffle
  tags:
    - setup-snowflake
  roles:
    - role: setup_snowflake

- name: Setup tor
  hosts: tor
  order: shuffle
  tags:
    - setup-tor
  roles:
    - role: setup_tor

- name: Setup final
  hosts: all
  order: shuffle
  tags:
    - setup-final
  roles:
    - role: setup_kernel
    - role: setup_autoupdate
    - role: info_healthy
